databases:
  - name: doctor-finder-db
    databaseName: doctor_finder
    user: doctor_finder_user
    plan: free

services:
  - type: web
    name: doctor-finder-backend
    runtime: node
    plan: free
    rootDir: backend/backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /api
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 18.19.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: doctor-finder-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: doctor-finder-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: doctor-finder-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: doctor-finder-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: doctor-finder-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
